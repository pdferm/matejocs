<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matejocs</title>
<style>
  :root{
    --bg:#f5f7fb;
    --panel:#ffffff;
    --text:#172033;
    --muted:#7d8797;
    --line:#dfe5ef;
    --accent:#3157d5;
    --accent-dark:#2442ac;
    --shadow:0 14px 36px rgba(31,48,85,.10);
  }

  *{box-sizing:border-box}

  html,body{
    margin:0;
    min-height:100%;
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  body{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
  }

  main{
    flex:1;
    width:min(1200px,100%);
    margin:0 auto;
    padding:clamp(24px,4vw,56px);
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  header{
    text-align:center;
    margin-bottom:clamp(28px,4vw,44px);
  }

  .brand{
    display:inline-flex;
    align-items:center;
    gap:14px;
  }

  .logo{
    width:58px;
    height:58px;
    border-radius:18px;
    background:var(--accent);
    color:#fff;
    display:grid;
    place-items:center;
    font-size:28px;
    font-weight:950;
    box-shadow:0 12px 28px rgba(49,87,213,.22);
  }

  h1{
    margin:0;
    font-size:clamp(44px,6vw,76px);
    line-height:.95;
    letter-spacing:-.045em;
  }

  .games{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:clamp(14px,2vw,22px);
  }

  .link{
    min-height:150px;
    padding:22px;
    border:1px solid var(--line);
    border-radius:24px;
    background:var(--panel);
    box-shadow:var(--shadow);
    text-decoration:none;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:clamp(19px,1.8vw,28px);
    font-weight:900;
    line-height:1.15;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease, color .15s ease;
  }

  .link:hover{
    transform:translateY(-4px);
    border-color:#bcc8e3;
    box-shadow:0 18px 44px rgba(31,48,85,.15);
    color:var(--accent);
  }

  .link:active{
    transform:translateY(-1px);
  }

  footer{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    padding:8px 16px 10px;
    color:#8a93a3;
    font-size:11px;
  }

  @media(max-width:900px){
    .games{grid-template-columns:repeat(2,minmax(0,1fr))}
  }

  @media(max-width:520px){
    main{
      justify-content:flex-start;
      padding:28px 16px 24px;
    }

    header{margin-bottom:24px}

    .logo{
      width:50px;
      height:50px;
      border-radius:15px;
      font-size:24px;
    }

    .games{grid-template-columns:1fr}

    .link{min-height:96px}

    footer{
      font-size:10px;
      padding-inline:10px;
    }
  }

  @media(prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>
<body>

<main>
  <header>
    <div class="brand">
      <div class="logo">M+</div>
      <h1>Matejocs</h1>
    </div>
  </header>

  <section class="games" aria-label="Jocs disponibles">
    <a class="link" href="6Sprintv1/index.html">6 al sprint (individual)</a>
    <a class="link" href="6Sprintv2/index.html">6 al sprint (parelles)</a>
    <a class="link" href="lletres/index.html">Lletres</a>
    <a class="link" href="xifres/index.html">Xifres</a>
    <a class="link" href="xifres4kids/index.html">Xifres 4 Kids</a>
    <a class="link" href="maze/index.html">Laberints</a>
    <a class="link" href="twopyramids/index.html">Piràmides</a>
    <a class="link" href="DivPlatforms/index.html">Multiple Jump</a>
  </section>
</main>

<footer>
  <span>Fet amb ❤ des de Carlet</span>
  <span>&copy; Raquel &amp; Javi, 2026</span>
</footer>

</body>
</html>
